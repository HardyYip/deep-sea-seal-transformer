name: Synthetic pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Verify model interface and independent weights
        run: python scripts/check_models.py
      - name: Verify synthetic training, inference and leakage guards
        run: python scripts/check_training_pipeline.py --device cpu
